<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestor de Obras</title>
<meta name="description" content="Gestor de Obras — sistema de gestão para construtoras: obras, cronograma, diário de obra, financeiro, materiais, equipe e clientes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<style>
:root{
  --bg:#f4f5f7;--card:#ffffff;--ink:#16191f;--mut:#6b7280;--line:#e5e7eb;--soft:#f9fafb;
  --pri:#f08a24;--pri2:#d9741a;--priSoft:#fff3e6;
  --side:#14181f;--sideInk:#c9ced6;--sideAct:#232a35;
  --ok:#16a34a;--okSoft:#e8f7ee;--warn:#d97706;--warnSoft:#fef6e4;--bad:#dc2626;--badSoft:#fdecec;--info:#2563eb;--infoSoft:#eaf1fe;
  --r:12px;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1116;--card:#171b22;--ink:#e8eaee;--mut:#9aa3af;--line:#262c36;--soft:#1c212a;--priSoft:#33230f;
  --side:#0a0d11;--sideAct:#1b212b;--okSoft:#12301f;--warnSoft:#33270e;--badSoft:#3a1616;--infoSoft:#142443;--sh:none}}
:root[data-theme="dark"]{--bg:#0e1116;--card:#171b22;--ink:#e8eaee;--mut:#9aa3af;--line:#262c36;--soft:#1c212a;--priSoft:#33230f;--side:#0a0d11;--sideAct:#1b212b;--okSoft:#12301f;--warnSoft:#33270e;--badSoft:#3a1616;--infoSoft:#142443;--sh:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri2)}
.hide{display:none!important}
.boot{min-height:100vh;display:grid;place-items:center;color:var(--mut);text-align:center}
.boot .logo{margin:0 auto 18px;width:46px;height:46px}.boot .logo svg{width:26px;height:26px}
.spin{width:26px;height:26px;margin:0 auto 10px;border:3px solid var(--line);border-top-color:var(--pri);border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
/* layout */
.app{display:flex;min-height:100vh}
.side{width:236px;background:var(--side);color:var(--sideInk);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px;color:#fff;font-weight:800;font-size:16px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--pri);display:grid;place-items:center;flex-shrink:0}
.logo svg{width:20px;height:20px;stroke:#fff}
.brand small{display:block;font-weight:500;font-size:11px;color:#8a93a0;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{flex:1;padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--sideInk);padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:var(--sideAct);color:#fff}
.nav button.on{background:var(--sideAct);color:#fff;box-shadow:inset 3px 0 0 var(--pri)}
.nav svg{width:18px;height:18px;flex-shrink:0}
.sidefoot{padding:14px 16px;border-top:1px solid #222935;font-size:12px}
.sidefoot b{color:#fff;display:block;font-size:13px}
.sidefoot button{margin-top:8px;background:none;border:1px solid #2c3442;color:var(--sideInk);border-radius:8px;padding:6px 10px;cursor:pointer;width:100%}
.main{flex:1;min-width:0;padding:26px 30px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;letter-spacing:-.02em}
.top p{margin:2px 0 0;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* componentes */
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--mut)}
a.btn{text-decoration:none;color:var(--ink)}
.banner a.btn{background:var(--card)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.btn.ok{color:var(--ok);border-color:var(--ok);background:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{margin:0 0 12px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.kpi span{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi b{display:block;font-size:22px;margin-top:6px;letter-spacing:-.02em}
.kpi small{color:var(--mut)}
.kpi.alert b{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{width:100%;border-collapse:collapse}
th{background:var(--soft);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:10px 12px;font-weight:700;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--soft)}
.r{text-align:right}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--okSoft);color:var(--ok)}.b-warn{background:var(--warnSoft);color:var(--warn)}.b-bad{background:var(--badSoft);color:var(--bad)}.b-info{background:var(--infoSoft);color:var(--info)}.b-mut{background:var(--soft);color:var(--mut);border:1px solid var(--line)}.b-pri{background:var(--priSoft);color:var(--pri2)}
.bar{height:8px;background:var(--soft);border:1px solid var(--line);border-radius:99px;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bar.g i{background:var(--ok)}
.pct{display:flex;align-items:center;gap:8px}.pct .bar{flex:1}.pct b{font-size:12px;min-width:36px;text-align:right}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--pri)}
.vazio{padding:30px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:10px;background:var(--card)}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it small{color:var(--mut);display:block}
.obra{cursor:pointer;transition:transform .12s}
.obra:hover{transform:translateY(-2px)}
.obra h4{margin:0;font-size:15.5px}
.obra .meta{color:var(--mut);font-size:12.5px;margin:3px 0 12px}
.obra .nums{display:flex;justify-content:space-between;margin-top:12px;font-size:12.5px;color:var(--mut)}
.obra .nums b{display:block;color:var(--ink);font-size:14px}
.sel{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.banner.warn{background:var(--warnSoft);color:var(--warn)}.banner.info{background:var(--infoSoft);color:var(--info)}
/* diário */
.diario{display:grid;gap:12px}
.dia{display:flex;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer}
.dia img{width:120px;height:90px;object-fit:cover;border-radius:8px;flex-shrink:0}
.dia h5{margin:0 0 4px;font-size:13.5px}
.dia p{margin:0;color:var(--mut);white-space:pre-wrap}
/* gantt */
.gantt{margin-bottom:16px}
.grow{display:flex;align-items:center;gap:10px;margin:6px 0}
.gname{width:150px;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.gtrack{flex:1;position:relative;height:20px;background:var(--soft);border-radius:6px}
.gbar{position:absolute;top:3px;bottom:3px;background:var(--priSoft);border:1px solid var(--pri);border-radius:5px;overflow:hidden}
.gfill{height:100%;background:var(--pri)}
.gtoday{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad)}
.gfoot{display:flex;justify-content:space-between;color:var(--mut);font-size:11.5px;padding-left:160px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:560px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 16px;font-size:17px}
.modal.wide{max-width:960px}
.padw{position:relative;border:2px dashed var(--line);border-radius:12px;background:#fff;margin-top:6px}
.pad{display:block;width:100%;height:190px;touch-action:none;cursor:crosshair}
.padl{position:absolute;left:14px;bottom:44px;right:14px;border-top:1px solid #cbd5e1;padding-top:4px;font-size:11.5px;color:#94a3b8;pointer-events:none}
.padw .btn{position:absolute;right:8px;top:8px}
.ctprev{max-height:230px;overflow-y:auto;white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:12.5px;margin-bottom:14px}
.amb{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}.ambh{display:flex;gap:10px;align-items:center;background:var(--soft);padding:9px 12px;border-bottom:1px solid var(--line)}.ambh span{color:var(--mut);font-size:12px;margin-right:auto}
.vit{display:grid;grid-template-columns:1.3fr auto 1.4fr auto;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}.vit:first-of-type{border-top:0}
.vit input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}.vit .vn input{border-color:transparent;background:transparent;font-weight:600}.vit .vn input:focus{border-color:var(--line);background:var(--bg)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border:0;background:var(--card);padding:7px 11px;font-weight:700;font-size:12px;cursor:pointer;color:var(--mut);border-left:1px solid var(--line)}.seg button:first-child{border-left:0}
.seg button.on.ok{background:var(--ok);color:#fff}.seg button.on.pend{background:var(--bad);color:#fff}.seg button.on.na{background:var(--mut);color:#fff}
.vf{display:flex;gap:6px;align-items:center}.vf img{width:46px;height:36px;object-fit:cover;border-radius:6px;cursor:pointer}.vf label.btn{cursor:pointer}
@media (max-width:860px){.vit{grid-template-columns:1fr auto}.vit .vo{grid-column:1/-1}.vit .vf{grid-column:1/-1;justify-content:flex-end}}
.opcs{display:grid;gap:10px}.opc{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;cursor:pointer}.opc:hover{border-color:var(--pri);background:var(--priSoft)}.opc b{display:block;font-size:14.5px;margin-bottom:2px}.opc span{color:var(--mut);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}.tags code{background:var(--priSoft);color:var(--pri2);padding:2px 7px;border-radius:6px;font-size:11.5px;cursor:pointer}
table.itens td{padding:5px 6px}table.itens input,table.itens select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);width:100%}
table.itens tbody tr{cursor:default}table.itens tbody tr:hover{background:none}
.totbox{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:flex-end;align-items:baseline;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.totbox div{display:flex;flex-direction:column;align-items:flex-end}.totbox span{font-size:11.5px;color:var(--mut)}.totbox .tt b{font-size:19px;color:var(--pri2)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:4px}
.fld input:not([type=checkbox]),.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.fld textarea{min-height:90px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--pri);border-color:transparent}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;cursor:pointer}
.prev{display:block;max-width:160px;border-radius:8px;margin-top:8px}
.mact{display:flex;gap:8px;margin-top:18px;align-items:center}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.checks{max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.checks label{display:flex;gap:8px;padding:6px 0;align-items:center;border-top:1px solid var(--line)}
.checks label:first-child{border-top:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:99;box-shadow:var(--sh)}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.authL{background:var(--side);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center;background-image:radial-gradient(circle at 80% 20%,rgba(240,138,36,.25),transparent 50%)}
.authL h1{font-size:38px;line-height:1.1;letter-spacing:-.03em;margin:22px 0 14px}
.authL p{color:#aab2bd;font-size:15.5px;max-width:440px}
.authL ul{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:10px;color:#d6dbe2}
.authL li::before{content:"✓";color:var(--pri);font-weight:800;margin-right:10px}
.authR{display:flex;align-items:center;justify-content:center;padding:30px 20px}
.authBox{width:100%;max-width:380px}
.authBox h2{margin:0 0 4px}
.authBox .tabs{margin-bottom:20px}
.authBox .btn{width:100%;justify-content:center;padding:11px}
.demo{margin-top:18px;padding:12px;border-radius:10px;background:var(--infoSoft);color:var(--info);font-size:12.5px}
/* portal */
.portal{max-width:760px;margin:0 auto;padding:30px 16px 60px}
.phead{background:var(--side);color:#fff;border-radius:16px;padding:26px;margin-bottom:18px}
.phead h1{margin:6px 0 4px;font-size:24px}
.phead p{margin:0;color:#aab2bd}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em}
@media (max-width:860px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:sticky;top:0;z-index:20}
  .brand{padding:12px 16px}
  .nav{flex-direction:row;overflow-x:auto;padding:0 8px 8px}
  .nav button{width:auto;white-space:nowrap;padding:8px 10px}
  .nav button.on{box-shadow:inset 0 -3px 0 var(--pri)}
  .sidefoot{display:none}
  .main{padding:18px 16px 60px}
  .grid2,.f2{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr}.authL{padding:32px 22px}.authL h1{font-size:28px}.authL ul{display:none}
  .gname{width:90px}.gfoot{padding-left:100px}
  .dia img{width:84px;height:70px}
}
</style>
</head>

<script>

// Cole aqui a configuração do seu projeto Firebase (Console > Configurações do projeto > Seus apps > Web).
// Enquanto ficar vazio, o sistema roda em MODO DEMONSTRAÇÃO (dados salvos só neste navegador).
const FIREBASE_CONFIG = {

const DIAS_TESTE = 7;                 // teste grátis

/* ======================================================== */

const USE_FB = !!FIREBASE_CONFIG.apiKey;
let auth = null, fs = null;
if (USE_FB) { firebase.initializeApp(FIREBASE_CONFIG); auth = firebase.auth(); fs = firebase.firestore(); fs.enablePersistence({synchronizeTabs:true}).catch(() => {}); }

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (Number(v) || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});

const gid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const iso = ms => { const d = new Date(ms); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const hoje = () => iso(Date.now());
const addDias = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const addMes = (s, n) => { const d = new Date(s + 'T12:00'); const dia = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const ult = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(dia, ult)); return d.toISOString().slice(0, 10); };
const fdata = s => s ? s.split('-').reverse().join('/') : '—';
const diasAte = s => Math.round((new Date(s + 'T12:00') - new Date(hoje() + 'T12:00')) / 864e5);
const soDig = s => String(s || '').replace(/\D/g, '');
const wa = (tel, txt) => { let t = soDig(tel); if (t && t.length <= 11) t = '55' + t; return `https://wa.me/${t}?text=${encodeURIComponent(txt || '')}`; };
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const IC = {
  dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  obra:'<path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/>',

const Demo = {
  get() { try { return JSON.parse(localStorage.getItem('gdo_demo')) || this.novo(); } catch (e) { return this.novo(); } },
  novo() { return {users:{}, perfis:{}, empresas:{}, dados:{}, portais:{}}; },
  set(d) { try { localStorage.setItem('gdo_demo', JSON.stringify(d)); } catch (e) { alert('O armazenamento do navegador encheu (fotos ocupam espaço). No modo demonstração o limite é pequeno; com o Firebase configurado não há esse problema.'); throw e; } }
};
const toTs = ms => firebase.firestore.Timestamp.fromMillis(ms);
const fixEmp = e => { if (e && e.venceTs && e.venceTs.toMillis) e.venceTs = e.venceTs.toMillis(); return e; };

const API = {
  async login(email, senha) {
    email = email.trim().toLowerCase();
    if (USE_FB) return (await auth.signInWithEmailAndPassword(email, senha)).user.uid;
    const d = Demo.get(), u = d.users[email];
    if (!u || u.senha !== senha) throw new Error('E-mail ou senha incorretos.');
    localStorage.setItem('gdo_sess', JSON.stringify({uid:u.uid, email})); return u.uid;
  },
  async criarConta(email, senha) {
    email = email.trim().toLowerCase();
    if (USE_FB) return (await auth.createUserWithEmailAndPassword(email, senha)).user.uid;
    const uid = this._demoUser(email, senha);
    localStorage.setItem('gdo_sess', JSON.stringify({uid, email})); return uid;
  },
  _demoUser(email, senha) {
    const d = Demo.get();
    if (d.users[email]) throw new Error('Este e-mail já está cadastrado.');
    if (String(senha).length < 6) throw new Error('A senha precisa ter pelo menos 6 caracteres.');
    const uid = gid(); d.users[email] = {uid, senha}; Demo.set(d); return uid;
  },
  async criarUsuarioSecundario(email, senha) {
    email = email.trim().toLowerCase();
    if (USE_FB) {
      const app2 = firebase.apps.find(a => a.name === 'sec') || firebase.initializeApp(FIREBASE_CONFIG, 'sec');
      const c = await app2.auth().createUserWithEmailAndPassword(email, senha);
      await app2.auth().signOut(); return c.user.uid;
    }
    return this._demoUser(email, senha);
  },
  async logout() { if (USE_FB) await auth.signOut(); localStorage.removeItem('gdo_sess'); },
  async uidAtual() {
    if (USE_FB) return new Promise(r => { const un = auth.onAuthStateChanged(u => { un(); r(u ? u.uid : null); }); });
    const s = JSON.parse(localStorage.getItem('gdo_sess') || 'null'); return s ? s.uid : null;
  },
  emailAtual() { if (USE_FB) return auth.currentUser ? auth.currentUser.email : ''; const s = JSON.parse(localStorage.getItem('gdo_sess') || 'null'); return s ? s.email : ''; },
  async resetSenha(email) { if (!USE_FB) throw new Error('Disponível quando o Firebase estiver configurado.'); await auth.sendPasswordResetEmail(email.trim()); },
  async getPerfil(uid) { if (USE_FB) { const s = await fs.doc('usuarios/' + uid).get(); return s.exists ? s.data() : null; } return Demo.get().perfis[uid] || null; },
  async setPerfil(uid, p) { if (USE_FB) return fs.doc('usuarios/' + uid).set(p, {merge:true}); const d = Demo.get(); d.perfis[uid] = {...(d.perfis[uid] || {}), ...p}; Demo.set(d); },
  async delPerfil(uid) { if (USE_FB) return fs.doc('usuarios/' + uid).delete(); const d = Demo.get(); delete d.perfis[uid]; Demo.set(d); },
  async usuariosDaEmpresa(eid) {
    if (USE_FB) return (await fs.collection('usuarios').where('empresaId', '==', eid).get()).docs.map(x => ({uid:x.id, ...x.data()}));
    const d = Demo.get(); return Object.entries(d.perfis).filter(([, p]) => p.empresaId === eid).map(([uid, p]) => ({uid, ...p}));
  },
  async getEmpresa(eid) { if (USE_FB) { const s = await fs.doc('empresas/' + eid).get(); return s.exists ? fixEmp({id:s.id, ...s.data()}) : null; } const e = Demo.get().empresas[eid]; return e ? {id:eid, ...e} : null; },
  async setEmpresa(eid, e) {
    const x = {...e}; delete x.id;
    if (USE_FB) { if (typeof x.venceTs === 'number') x.venceTs = toTs(x.venceTs); return fs.doc('empresas/' + eid).set(x, {merge:true}); }
    const d = Demo.get(); d.empresas[eid] = {...(d.empresas[eid] || {}), ...x}; Demo.set(d);
  },
  async listEmpresas() {
    if (USE_FB) return (await fs.collection('empresas').get()).docs.map(x => fixEmp({id:x.id, ...x.data()}));
    return Object.entries(Demo.get().empresas).map(([id, e]) => ({id, ...e}));
  },
  async list(eid, col, src) {
    if (USE_FB) return (await fs.collection(`empresas/${eid}/${col}`).get(src ? {source:src} : undefined)).docs.map(x => ({...x.data(), id:x.id}));
    const d = Demo.get(); return Object.values((d.dados[eid] || {})[col] || {});
  },
  async getDoc(eid, col, id) {
    if (USE_FB) { const s = await fs.doc(`empresas/${eid}/${col}/${id}`).get(); return s.exists ? s.data() : null; }

  async put(eid, col, id, obj) {
    if (USE_FB) return fs.doc(`empresas/${eid}/${col}/${id}`).set(obj);

  async del(eid, col, id) {

async function carregarTudo() {
  // 1º abre com o que já está salvo no aparelho (instantâneo) e atualiza do servidor em segundo plano
  if (USE_FB) {
    try {
      const cache = await Promise.all(COLS.map(c => API.list(S.eid, c, 'cache')));
      if (cache.some(a => a.length)) { COLS.forEach((c, i) => { S.data[c] = cache[i]; }); setTimeout(atualizarDoServidor, 0); return; }
    } catch (e) {}
  }
  const r = await Promise.all(COLS.map(c => API.list(S.eid, c)));
  COLS.forEach((c, i) => { S.data[c] = r[i]; });
}
async function atualizarDoServidor() {
  try { const r = await Promise.all(COLS.map(c => API.list(S.eid, c, 'server'))); COLS.forEach((c, i) => { S.data[c] = r[i]; }); if (!$('#ov') && $('#main')) render(); }
  catch (e) { console.warn('Sem conexão, usando dados do aparelho', e); }
}
const carregando = (msg = 'Carregando...') => { $('#root').innerHTML = `<div class="boot"><div><div class="spin"></div><span>${msg}</span></div></div>`; };
async function salvar(col, obj) {
  obj.id = obj.id || gid(); obj.atualizadoEm = Date.now(); if (!obj.criadoEm) obj.criadoEm = Date.now();
  await API.put(S.eid, col, obj.id, obj);
  const a = S.data[col], i = a.findIndex(x => x.id === obj.id); if (i >= 0) a[i] = obj; else a.push(obj);
  return obj;
}
async function excluir(col, id) { await API.del(S.eid, col, id); S.data[col] = S.data[col].filter(x => x.id !== id); }
const achar = (col, id) => (S.data[col] || []).find(x => x.id === id);
const nomeDe = (col, id, vazio = '—') => { const o = achar(col, id); return o ? rotulo(col, o) : vazio; };
function rotulo(col, o) {
  if (col === 'materiais') return `${o.nome} (${o.unidade || 'un'})${o.obraId ? ' — ' + nomeDe('obras', o.obraId) : ' — Depósito'}`;
  if (col === 'contratos') return `Contrato ${o.numero || ''} — ${nomeDe('clientes', o.clienteId)}`;
  return o.nome || o.descricao || o.id;
}

function progressoObra(oid) {
  const et = S.data.etapas.filter(e => e.obraId === oid); if (!et.length) return 0;
  const tot = et.reduce((s, e) => s + (+e.custoPrevisto || 0), 0);
  if (tot > 0) return et.reduce((s, e) => s + (+e.custoPrevisto || 0) * (+e.percentual || 0), 0) / tot;
  return et.reduce((s, e) => s + (+e.percentual || 0), 0) / et.length;
}
const lancObra = oid => S.data.lancamentos.filter(l => l.obraId === oid);
const gastoObra = oid => lancObra(oid).filter(l => l.tipo === 'Pagar' && l.pago).reduce((s, l) => s + (+l.valor || 0), 0);
const aPagarObra = oid => lancObra(oid).filter(l => l.tipo === 'Pagar' && !l.pago).reduce((s, l) => s + (+l.valor || 0), 0);
const recebidoObra = oid => lancObra(oid).filter(l => l.tipo === 'Receber' && l.pago).reduce((s, l) => s + (+l.valor || 0), 0);
function statusLanc(l) {
  if (l.pago) return `<span class="badge b-ok">${l.tipo === 'Receber' ? 'Recebido' : 'Pago'}</span>`;
  const d = diasAte(l.vencimento);
  if (d < 0) return `<span class="badge b-bad">Vencido</span>`;
  if (d <= 3) return `<span class="badge b-warn">Vence ${d === 0 ? 'hoje' : 'em ' + d + 'd'}</span>`;
  return `<span class="badge b-mut">Em aberto</span>`;
}
const badgeObra = s => `<span class="badge ${({'Em andamento':'b-pri','Concluída':'b-ok','Pausada':'b-warn'})[s] || 'b-mut'}">${esc(s || 'Planejamento')}</span>`;
const barra = (p, cls = '') => `<div class="pct"><div class="bar ${cls}"><i style="width:${Math.min(100, Math.max(0, p)).toFixed(0)}%"></i></div><b>${Math.round(p)}%</b></div>`;

function campo(f, v) {
  const id = 'f_' + f.k, t = f.type || 'text', ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
  if (t === 'select') return `<select id="${id}">${f.opts.map((o, i) => `<option value="${esc(o)}" ${o == v ? 'selected' : ''}>${esc(f.labels ? f.labels[i] : o)}</option>`).join('')}</select>`;
  if (t === 'ref') return `<select id="${id}"><option value="">— ${esc(f.vazio || 'Selecione')} —</option>${(S.data[f.col] || []).slice().sort((a, b) => rotulo(f.col, a).localeCompare(rotulo(f.col, b))).map(o => `<option value="${o.id}" ${o.id === v ? 'selected' : ''}>${esc(rotulo(f.col, o))}</option>`).join('')}</select>`;
  if (t === 'textarea') return `<textarea id="${id}"${ph}>${esc(v)}</textarea>`;
  if (t === 'check') return `<label class="chk"><input type="checkbox" id="${id}" ${v ? 'checked' : ''}> ${esc(f.l)}</label>`;
  if (t === 'image') return `<input type="file" accept="image/*" id="${id}">${v ? `<img src="${v}" class="prev"><a href="#" id="verFoto" style="font-size:12.5px">Ver foto em tamanho grande</a>` : ''}`;
  const it = {money:'number" step="0.01" min="0', number:'number" step="any', pct:'number" min="0" max="100', date:'date'}[t] || 'text';
  return `<input id="${id}" type="${it}" value="${esc(v ?? '')}"${ph}>`;
}

function abrirForm(col, rec = {}) {
  const sc = SCHEMA[col], novo = !rec.id;
  const fl = sc.fields.map(f => `<div class="fld" ${f.half ? '' : 'style="grid-column:1/-1"'}>${f.type === 'check' ? campo(f, rec[f.k]) : `<label>${esc(f.l)}${f.req ? ' *' : ''}</label>${campo(f, f.type === 'image' ? (rec[f.k + 'Thumb'] || rec[f.k]) : rec[f.k])}`}</div>`).join('');
  modal(`<h3>${novo ? 'Novo' : 'Editar'}: ${esc(sc.titulo)}</h3><form id="frm"><div class="f2">${fl}</div>
    <div class="mact">${!novo ? '<button type="button" class="btn danger" id="bdel">Excluir</button>' : ''}<span style="flex:1"></span>
    <button type="button" class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" id="bsalvar">Salvar</button></div></form>`);
  $('#frm').onsubmit = async e => {
    e.preventDefault();
    const o = {...rec};
    for (const f of sc.fields) {
      const el = $('#f_' + f.k), t = f.type || 'text';
      if (t === 'check') o[f.k] = el.checked;
      else if (t === 'image') { if (el.files[0]) { const r = await comprimir(el.files[0]); o.id = o.id || gid(); o._fotoNova = r.foto; delete o[f.k]; o[f.k + 'Thumb'] = r.thumb; o.temFoto = true; } }
      else if (['money','number','pct'].includes(t)) o[f.k] = el.value === '' ? '' : Number(el.value);
      else o[f.k] = el.value.trim();
      if (f.req && (o[f.k] === '' || o[f.k] == null)) { toast('Preencha: ' + f.l); el.focus(); return; }
    }
    $('#bsalvar').disabled = true;
    try {
      if (HOOK[col] && HOOK[col].antes) { if (await HOOK[col].antes(o, rec) === false) { $('#bsalvar').disabled = false; return; } }
      const fotoNova = o._fotoNova; delete o._fotoNova;
      if (fotoNova) await API.put(S.eid, 'fotos', o.id, {foto:fotoNova});
      await salvar(col, o);
      if (HOOK[col] && HOOK[col].depois) await HOOK[col].depois(o, rec);
      fecharModal(); render(); toast('Salvo!');
    } catch (err) { console.error(err); toast('Erro ao salvar: ' + err.message); $('#bsalvar').disabled = false; }
  };
  const vf = $('#verFoto');
  if (vf) vf.onclick = async e => { e.preventDefault(); vf.textContent = 'Abrindo...'; const x = rec.foto ? {foto:rec.foto} : await API.getDoc(S.eid, 'fotos', rec.id); vf.textContent = 'Ver foto em tamanho grande'; if (x && x.foto) { const w = window.open(); w.document.write(`<title>Foto</title><body style="margin:0;background:#000"><img src="${x.foto}" style="max-width:100%;display:block;margin:auto">`); } };
  if (!novo) $('#bdel').onclick = async () => {
    if (!confirm('Excluir este registro? Essa ação não pode ser desfeita.')) return;
    try { if (HOOK[col] && HOOK[col].excluir) await HOOK[col].excluir(rec); await excluir(col, rec.id); fecharModal(); render(); toast('Excluído'); }
    catch (err) { toast('Erro: ' + err.message); }
  };
}

/* regras automáticas ao salvar */
async function ajustaEstoque(mov, sinal) {
  const m = achar('materiais', mov.materialId); if (!m) return;
  const d = (mov.tipo === 'Entrada' ? 1 : -1) * (+mov.quantidade || 0) * sinal;
  await salvar('materiais', {...m, quantidade:+((+m.quantidade || 0) + d).toFixed(3)});
}
const HOOK = {
  obras:{
    antes:o => { if (o.portal && !o.portalToken) o.portalToken = gid() + gid(); },
    depois:o => syncPortal(o.id),
    excluir:async o => {
      const lig = ['etapas','diario'].reduce((s, c) => s + S.data[c].filter(x => x.obraId === o.id).length, 0);
      if (lig && !confirm(`Esta obra tem ${lig} etapa(s)/registro(s) de diário que também serão apagados. Continuar?`)) throw new Error('cancelado');
      for (const c of ['etapas','diario']) for (const x of S.data[c].filter(x => x.obraId === o.id)) { if (x.temFoto) await API.del(S.eid, 'fotos', x.id).catch(() => {}); await excluir(c, x.id); }
      if (o.portalToken) await API.setPortal(o.portalToken, {empresaId:S.eid, ativo:false});
    }
  },
  etapas:{depois:o => syncPortal(o.obraId), excluir:o => setTimeout(() => syncPortal(o.obraId), 50)},
  diario:{depois:o => syncPortal(o.obraId), excluir:async o => { if (o.temFoto) await API.del(S.eid, 'fotos', o.id).catch(() => {}); setTimeout(() => syncPortal(o.obraId), 50); }},
  lancamentos:{antes:(o, old) => { if (o.pago && !old.pago) o.dataPagamento = hoje(); if (!o.pago) o.dataPagamento = ''; }},
  funcionarios:{antes:(o, old) => { if (!old.id && o.ativo === false && !('ativo' in old)) o.ativo = true; }},
  movimentos:{
    antes:async (o, old) => {
      const m = achar('materiais', o.materialId);
      let atual = +m.quantidade || 0;
      if (old.id && old.materialId === o.materialId) atual -= (old.tipo === 'Entrada' ? 1 : -1) * (+old.quantidade || 0);
      if (o.tipo === 'Saída' && atual - (+o.quantidade || 0) < 0) { toast(`Estoque insuficiente: há ${num(atual)} ${m.unidade || ''}`); return false; }
      if (!o.data) o.data = hoje();
      if (old.id) await ajustaEstoque(old, -1);
    },
    depois:o => ajustaEstoque(o, 1),
    excluir:o => ajustaEstoque(o, -1)
  }
};

/* fotos: reduz o tamanho antes de salvar */
function comprimir(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const mk = (max, q) => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', q); };
      res({foto:mk(1000, .6), thumb:mk(360, .55)}); URL.revokeObjectURL(img.src);
    };
    img.onerror = rej; img.src = URL.createObjectURL(file);
  });
}

function logoComprimido(file) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => { const s = Math.min(1, 360 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .85)); URL.revokeObjectURL(img.src); }; img.onerror = rej; img.src = URL.createObjectURL(file); });
}
/* portal do cliente: cópia pública e resumida da obra */
async function syncPortal(oid) {
  const o = achar('obras', oid); if (!o || !o.portalToken) return;
  if (!o.portal) return API.setPortal(o.portalToken, {empresaId:S.eid, ativo:false});
  const et = S.data.etapas.filter(e => e.obraId === oid).sort((a, b) => (a.inicio || '').localeCompare(b.inicio || '')).map(e => ({nome:e.nome, inicio:e.inicio || '', fim:e.fim || '', percentual:+e.percentual || 0}));
  const di = S.data.diario.filter(d => d.obraId === oid).sort((a, b) => b.data.localeCompare(a.data)).slice(0, 15).map(d => ({data:d.data, texto:d.texto, clima:d.clima || '', thumb:d.fotoThumb || ''}));
  await API.setPortal(o.portalToken, {empresaId:S.eid, ativo:true, empresaNome:S.empresa.nome || '', empresaTel:S.empresa.telefone || '', obraNome:o.nome, endereco:o.endereco || '', status:o.status || '', inicio:o.inicio || '', previsao:o.previsao || '', progresso:Math.round(progressoObra(oid)), etapas:et, diario:di, atualizadoEm:Date.now()});
}
const linkPortal = o => location.origin + location.pathname + '?portal=' + o.portalToken;

}

function gantt(et) {
  const ds = et.filter(e => e.inicio && e.fim); if (!ds.length) return '';
  const t = s => +new Date(s + 'T12:00');
  const min = Math.min(...ds.map(e => t(e.inicio))), max = Math.max(...ds.map(e => t(e.fim))), span = Math.max(max - min, 864e5);
  const now = (t(hoje()) - min) / span * 100;
  return `<div class="card gantt"><h3>Cronograma</h3>${ds.map(e => { const l = (t(e.inicio) - min) / span * 100, w = Math.max((t(e.fim) - t(e.inicio)) / span * 100, 1.5);
    return `<div class="grow"><div class="gname" title="${esc(e.nome)}">${esc(e.nome)}</div><div class="gtrack"><div class="gbar" style="left:${l}%;width:${w}%"><div class="gfill" style="width:${+e.percentual || 0}%"></div></div>${now >= 0 && now <= 100 ? `<div class="gtoday" style="left:${now}%" title="Hoje"></div>` : ''}</div></div>`; }).join('')}
    <div class="gfoot"><span>${fdata(ds.map(e => e.inicio).sort()[0])}</span><span style="color:var(--bad)">▍ hoje</span><span>${fdata(ds.map(e => e.fim).sort().pop())}</span></div></div>`;
}

      + (ds.length ? `<div class="diario">${ds.map(d => `<div class="dia" data-act="edit" data-a="diario" data-b="${d.id}">${d.fotoThumb ? `<img src="${d.fotoThumb}" alt="">` : ''}<div><h5>${fdata(d.data)} · ${esc(d.clima || '')}${d.equipe ? ` · ${d.equipe} pessoa(s)` : ''}</h5><p>${esc(d.texto)}</p></div></div>`).join('')}</div>` : '<div class="vazio">Nenhum registro ainda. Registre o que foi feito no dia, com foto.</div>');
  } else if (at === 'fin') {

    corpo = `<div class="row" style="justify-content:flex-end;margin-bottom:12px"><button class="btn pri" data-act="novo" data-a="lancamentos" data-b="${o.id}">+ Lançamento</button></div>` + tabelaLanc(ls);

  } else if (at === 'mat') {
    corpo = `<div class="row" style="justify-content:flex-end;margin-bottom:12px"><button class="btn" data-act="novo" data-a="movimentos">Entrada / saída</button><button class="btn pri" data-act="novo" data-a="pedidos" data-b="${o.id}">+ Pedido de compra</button></div>`
      + `<h3 style="font-size:14px">Materiais nesta obra</h3>` + tabelaMat(S.data.materiais.filter(m => m.obraId === o.id))
      + `<h3 style="font-size:14px;margin-top:20px">Pedidos de compra</h3>` + tabelaPed(S.data.pedidos.filter(x => x.obraId === o.id));
  } else {
    const fs_ = S.data.funcionarios.filter(f => f.obraId === o.id && f.ativo !== false);
    const aps = S.data.apontamentos.filter(a => a.obraId === o.id);
    const custoMO = aps.reduce((s, a) => s + (+a.dias || 0) * (+(achar('funcionarios', a.funcionarioId) || {}).diaria || 0), 0);
    corpo = `<div class="row" style="justify-content:space-between;margin-bottom:12px"><span style="color:var(--mut)">${aps.length} diária(s) lançada(s)${fin ? ' · ' + brl(custoMO) + ' em mão de obra' : ''}</span><button class="btn pri" data-act="lancarDiarias" data-a="${o.id}">Lançar diárias do dia</button></div>`
      + tabela('funcionarios', fs_, [{h:'Nome', k:'nome'}, {h:'Função', k:'funcao'}, {h:'Diária', r:1, f:f => brl(f.diaria)}], 'Nenhum funcionário alocado nesta obra (defina a "Obra atual" no cadastro do funcionário).');
  }
  return `<button class="btn sm" data-act="nav" data-a="obras" style="margin-bottom:14px">← Obras</button>`
  + topo(esc(o.nome) + ' ' + badgeObra(o.status), `${esc(nomeDe('clientes', o.clienteId, 'Sem cliente'))}${o.endereco ? ' · ' + esc(o.endereco) : ''} · ${fdata(o.inicio)} → ${fdata(o.previsao)}`,
     `${o.portal && o.portalToken ? `<button class="btn" data-act="portal" data-a="${o.id}">🔗 Link do cliente</button>` : ''}<button class="btn" data-act="edit" data-a="obras" data-b="${o.id}">Editar obra</button>`)
  + `<div class="kpis"><div class="kpi"><span>Avanço físico</span><b>${Math.round(p)}%</b>${barra(p)}</div>
    ${fin ? `<div class="kpi"><span>Orçamento</span><b>${brl(orc)}</b></div>
    <div class="kpi ${orc && g + ap > orc ? 'alert' : ''}"><span>Gasto (pago)</span><b>${brl(g)}</b><small>+ ${brl(ap)} a pagar${orc ? ` · ${Math.round((g + ap) / orc * 100)}% do orçamento` : ''}</small></div>
    <div class="kpi"><span>Recebido do cliente</span><b style="color:var(--ok)">${brl(rec)}</b><small>lucro de caixa: ${brl(rec - g)}</small></div>` : ''}
    <div class="kpi"><span>Prazo</span><b>${o.previsao ? (o.status === 'Concluída' ? 'Entregue' : diasAte(o.previsao) >= 0 ? diasAte(o.previsao) + ' dias' : 'Atrasada') : '—'}</b><small>${o.status === 'Concluída' && o.entregueEm ? 'entregue em ' + fdata(o.entregueEm) : o.previsao ? 'entrega ' + fdata(o.previsao) : 'sem previsão'}</small></div></div>`
  + tabs('obra', abas) + corpo;
}

/* ---------- financeiro ---------- */
function tabelaLanc(ls) {
  return tabela('lancamentos', ls, [{h:'Vencimento', f:l => fdata(l.vencimento)}, {h:'Descrição', f:l => `<b>${esc(l.descricao)}</b><br><small style="color:var(--mut)">${esc(l.categoria || '')}${l.obraId ? ' · ' + esc(nomeDe('obras', l.obraId)) : ''}</small>`},
    {h:'Tipo', f:l => `<span class="badge ${l.tipo === 'Receber' ? 'b-ok' : 'b-mut'}">${l.tipo === 'Receber' ? '↑ Receber' : '↓ Pagar'}</span>`},
    {h:'Valor', r:1, f:l => `<b style="color:${l.tipo === 'Receber' ? 'var(--ok)' : 'inherit'}">${brl(l.valor)}</b>`}, {h:'Situação', f:statusLanc},
    {h:'', r:1, f:l => l.pago ? '' : `<button class="btn sm ok" data-act="baixar" data-a="${l.id}">${l.tipo === 'Receber' ? 'Recebi' : 'Paguei'}</button>`}], 'Nenhum lançamento.');
}
function pgFin() {
  const F = S.filtro.fin || (S.filtro.fin = {tipo:'', sit:'aberto', obra:'', mes:''});
  let ls = S.data.lancamentos.slice();
  if (F.tipo) ls = ls.filter(l => l.tipo === F.tipo);
  if (F.obra) ls = ls.filter(l => (F.obra === '_' ? !l.obraId : l.obraId === F.obra));
  if (F.sit === 'aberto') ls = ls.filter(l => !l.pago); else if (F.sit === 'pago') ls = ls.filter(l => l.pago); else if (F.sit === 'vencido') ls = ls.filter(l => !l.pago && l.vencimento < hoje());
  if (F.mes) ls = ls.filter(l => (l.vencimento || '').startsWith(F.mes));
  ls.sort((a, b) => F.sit === 'pago' ? b.vencimento.localeCompare(a.vencimento) : a.vencimento.localeCompare(b.vencimento));
  const soma = (t, pago) => S.data.lancamentos.filter(l => l.tipo === t && !!l.pago === pago).reduce((s, l) => s + +l.valor, 0);
  const tr = ls.filter(l => l.tipo === 'Receber').reduce((s, l) => s + +l.valor, 0), tp = ls.filter(l => l.tipo === 'Pagar').reduce((s, l) => s + +l.valor, 0);
  const op = (v, l, cur) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${l}</option>`;
  const meses = [...new Set(S.data.lancamentos.map(l => (l.vencimento || '').slice(0, 7)).filter(Boolean))].sort().reverse();
  return topo('Financeiro', 'Contas a pagar e a receber de todas as obras', `<button class="btn pri" data-act="novo" data-a="lancamentos">+ Lançamento</button>`)
  + `<div class="kpis"><div class="kpi"><span>A receber (em aberto)</span><b style="color:var(--ok)">${brl(soma('Receber', false))}</b></div><div class="kpi"><span>A pagar (em aberto)</span><b>${brl(soma('Pagar', false))}</b></div>
    <div class="kpi"><span>Total recebido</span><b>${brl(soma('Receber', true))}</b></div><div class="kpi"><span>Total pago</span><b>${brl(soma('Pagar', true))}</b></div></div>
  <div class="row" style="margin-bottom:12px">
    <select class="sel" data-chg="fin" data-a="tipo">${op('', 'Pagar e receber', F.tipo)}${op('Pagar', 'Só a pagar', F.tipo)}${op('Receber', 'Só a receber', F.tipo)}</select>
    <select class="sel" data-chg="fin" data-a="sit">${op('aberto', 'Em aberto', F.sit)}${op('vencido', 'Vencidos', F.sit)}${op('pago', 'Pagos / recebidos', F.sit)}${op('', 'Todos', F.sit)}</select>
    <select class="sel" data-chg="fin" data-a="obra">${op('', 'Todas as obras', F.obra)}${op('_', 'Sem obra (administrativo)', F.obra)}${S.data.obras.map(o => op(o.id, esc(o.nome), F.obra)).join('')}</select>
    <select class="sel" data-chg="fin" data-a="mes">${op('', 'Qualquer mês', F.mes)}${meses.map(m => op(m, m.split('-').reverse().join('/'), F.mes)).join('')}</select>
    <span style="margin-left:auto;color:var(--mut)">Filtrado: <b style="color:var(--ok)">+${brl(tr)}</b> · <b>−${brl(tp)}</b></span></div>` + tabelaLanc(ls);
}

    {h:'Mínimo', r:1, f:m => m.minimo === '' || m.minimo == null ? '—' : num(m.minimo)}, ...(pode('financeiro') ? [{h:'Valor em estoque', r:1, f:m => brl((+m.quantidade || 0) * (+m.custoUnit || 0))}] : []),
    {h:'', r:1, f:m => `<button class="btn sm" data-act="mov" data-a="${m.id}" data-b="Entrada">+ Entrada</button> <button class="btn sm" data-act="mov" data-a="${m.id}" data-b="Saída">− Saída</button>`}], 'Nenhum material cadastrado.');

function tabelaPed(ps) {

    {h:'Valor', r:1, f:p => brl(p.valor)}, {h:'Status', f:p => `<span class="badge ${({Entregue:'b-ok', Aprovado:'b-info', Cancelado:'b-mut'})[p.status] || 'b-warn'}">${esc(p.status || 'Aberto')}</span>`},
    {h:'', r:1, f:p => { const fo = achar('fornecedores', p.fornecedorId); return `${fo && fo.telefone ? `<a class="btn sm" target="_blank" data-stop href="${wa(fo.telefone, textoPedido(p))}">WhatsApp</a> ` : ''}${p.lancamentoId || p.status === 'Cancelado' || !pode('financeiro') ? '' : `<button class="btn sm" data-act="pedConta" data-a="${p.id}">Gerar conta</button>`}`; }}], 'Nenhum pedido de compra.');

const textoPedido = p => `Olá! Pedido de compra da ${S.empresa.nome}${p.obraId ? ' para a obra ' + nomeDe('obras', p.obraId) : ''}:\n\n${p.itens}\n\n${p.previsaoEntrega ? 'Entrega até: ' + fdata(p.previsaoEntrega) + '\n' : ''}Pode confirmar valores e prazo?`;
function pgMat() {

  else if (at === 'mov') c = `<div class="row" style="justify-content:flex-end;margin-bottom:12px"><button class="btn pri" data-act="novo" data-a="movimentos">+ Entrada / saída</button></div>`
    + tabela('movimentos', S.data.movimentos.slice().sort((a, b) => (b.data || '').localeCompare(a.data || '') || b.criadoEm - a.criadoEm), [{h:'Data', f:m => fdata(m.data)}, {h:'Material', f:m => esc(nomeDe('materiais', m.materialId))},

  else c = `<div class="row" style="justify-content:flex-end;margin-bottom:12px"><button class="btn pri" data-act="novo" data-a="fornecedores">+ Fornecedor</button></div>`

  return topo('Materiais', 'Estoque por obra, entradas e saídas, compras e fornecedores') + tabs('mat', [['est','Estoque'], ['mov','Movimentações'], ['ped','Pedidos de compra'], ['for','Fornecedores']]) + c;

      {h:'Diária', r:1, f:f => brl(f.diaria)}, {h:'Diárias em aberto', r:1, f:f => num(diariasAbertas(f.id).reduce((s, a) => s + +a.dias, 0))},

      return `<tr><td><b>${esc(e.nome)}</b><br><small style="color:var(--mut)">${esc(e.cidade || '')}</small></td><td>${esc(e.donoNome || '')}<br><small style="color:var(--mut)">${esc(e.donoEmail || '')} ${e.telefone ? '· ' + esc(e.telefone) : ''}</small></td><td>${st}</td>
      <td>${fdata(iso(e.venceTs || 0))}<br><small style="color:${d < 0 ? 'var(--bad)' : 'var(--mut)'}">${d < 0 ? Math.abs(d) + ' dia(s) atrás' : 'em ' + d + ' dia(s)'}</small></td>

/* ===================== ORÇAMENTOS ===================== */
const ETAPAS_PADRAO = ['Serviços preliminares','Fundação','Estrutura','Alvenaria','Cobertura','Instalações elétricas','Instalações hidráulicas','Reboco e contrapiso','Piso e revestimento','Esquadrias','Pintura','Louças e metais','Acabamento','Limpeza final','Mão de obra','Projeto e taxas'];
const STATUS_ORC = ['Rascunho','Enviado','Aprovado','Recusado'];
const badgeOrc = s => `<span class="badge ${({Enviado:'b-info', Aprovado:'b-ok', Recusado:'b-bad'})[s] || 'b-mut'}">${esc(s || 'Rascunho')}</span>`;
function totaisOrc(o) {
  const custo = (o.itens || []).reduce((s, i) => s + (+i.qtd || 0) * (+i.valor || 0), 0);
  const fat = 1 + (+o.bdiPct || 0) / 100, preco = custo * fat;
  const desc = preco * (+o.descontoPct || 0) / 100;
  return {custo, fat, preco, desc, total:preco - desc, lucro:preco - desc - custo};
}
const clienteOrc = o => { const c = achar('clientes', o.clienteId); return c ? c : {nome:o.clienteNome || '', telefone:o.clienteTel || '', cpfCnpj:'', email:'', endereco:''}; };
function proximoNumOrc() {
  const ano = hoje().slice(0, 4);
  const n = S.data.orcamentos.map(o => (o.numero || '').match(new RegExp(`ORC-${ano}-(\\d+)`))).filter(Boolean).map(m => +m[1]);
  return `ORC-${ano}-${String((n.length ? Math.max(...n) : 0) + 1).padStart(3, '0')}`;
}
function gruposOrc(itens) {
  const g = []; const idx = {};
  itens.forEach(i => { const k = (i.etapa || '').trim() || 'Serviços'; if (!(k in idx)) { idx[k] = g.length; g.push({etapa:k, itens:[]}); } g[idx[k]].itens.push(i); });
  return g;
}

function pgOrc() {
  const F = S.filtro.orc || '';
  let os = S.data.orcamentos.slice().sort((a, b) => (b.numero || '').localeCompare(a.numero || ''));
  if (F) os = os.filter(o => o.status === F);
  const soma = st => S.data.orcamentos.filter(o => o.status === st).reduce((s, o) => s + totaisOrc(o).total, 0);
  const env = S.data.orcamentos.filter(o => o.status === 'Enviado' || o.status === 'Aprovado' || o.status === 'Recusado');
  const conv = env.length ? S.data.orcamentos.filter(o => o.status === 'Aprovado').length / env.length * 100 : 0;
  return topo('Orçamentos', 'Monte o orçamento, gere o PDF e envie para o cliente', `<select class="sel" data-chg="filtro" data-a="orc"><option value="">Todos</option>${STATUS_ORC.map(s => `<option ${s === F ? 'selected' : ''}>${s}</option>`).join('')}</select><button class="btn pri" data-act="novoOrc">+ Novo orçamento</button>`)
  + `<div class="kpis"><div class="kpi"><span>Aguardando resposta</span><b>${brl(soma('Enviado'))}</b><small>${S.data.orcamentos.filter(o => o.status === 'Enviado').length} orçamento(s) enviados</small></div>
    <div class="kpi"><span>Aprovados</span><b style="color:var(--ok)">${brl(soma('Aprovado'))}</b></div>
    <div class="kpi"><span>Taxa de aprovação</span><b>${Math.round(conv)}%</b><small>dos que foram enviados</small></div>
    <div class="kpi"><span>Em rascunho</span><b>${S.data.orcamentos.filter(o => (o.status || 'Rascunho') === 'Rascunho').length}</b></div></div>`
  + tabela('orcamentos', os, [{h:'Nº', f:o => `<b>${esc(o.numero)}</b>`}, {h:'Cliente / serviço', f:o => `<b>${esc(clienteOrc(o).nome || '—')}</b><br><small style="color:var(--mut)">${esc(o.titulo || '')}</small>`},
    {h:'Data', f:o => fdata(o.data)}, {h:'Validade', f:o => { const v = addDias(o.data, +o.validadeDias || 0), d = diasAte(v); return o.status === 'Aprovado' || o.status === 'Recusado' ? fdata(v) : `<span style="color:${d < 0 ? 'var(--bad)' : 'inherit'}">${fdata(v)}${d < 0 ? ' (vencido)' : ''}</span>`; }},
    {h:'Total', r:1, f:o => `<b>${brl(totaisOrc(o).total)}</b>`}, {h:'Status', f:o => badgeOrc(o.status)},
    {h:'', r:1, f:o => `<button class="btn sm" data-act="pdfOrc" data-a="${o.id}">PDF</button>${o.status !== 'Aprovado' ? ` <button class="btn sm ok" data-act="aprovarOrc" data-a="${o.id}">Aprovar</button>` : o.obraId ? ` <button class="btn sm" data-act="obra" data-a="${o.obraId}">Ver obra</button>` : ''}`}],
    'Nenhum orçamento ainda. Clique em "+ Novo orçamento" para montar o primeiro.');
}

    <div class="fld" style="grid-column:1/-1"><label>Local da obra</label><input id="o_end" value="${esc(o.endereco)}"></div>

    <div class="fld"><label>Validade (dias)</label><input type="number" id="o_val" value="${esc(o.validadeDias)}"></div>
    <div class="fld"><label>Prazo de execução</label><input id="o_prazo" value="${esc(o.prazo)}" placeholder="Ex.: 120 dias após o início"></div>
    <div class="fld"><label>Status</label><select id="o_st">${STATUS_ORC.map(s => `<option ${s === (o.status || 'Rascunho') ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
  </div>
  <div class="fld"><label>Itens do orçamento <small style="font-weight:400">(valor unitário = seu custo; o BDI/margem é somado no preço do cliente)</small></label>
  <div class="tw"><table class="itens"><thead><tr><th>Etapa</th><th>Descrição</th><th>Un.</th><th class="r">Qtd.</th><th class="r">Custo unit.</th><th class="r">Total</th><th></th></tr></thead><tbody id="o_itens"></tbody></table></div>
  <div class="row" style="margin-top:8px"><button type="button" class="btn sm" id="o_add">+ Item</button><button type="button" class="btn sm" id="o_addEt">+ Etapa nova</button></div></div>
  <div class="f2"><div class="fld"><label>BDI / margem (%)</label><input type="number" step="0.1" id="o_bdi" value="${esc(o.bdiPct)}"></div>
    <div class="fld"><label>Desconto para o cliente (%)</label><input type="number" step="0.1" id="o_desc" value="${esc(o.descontoPct)}"></div></div>
  <div id="o_tot" class="totbox"></div>
  <div class="fld"><label>Condições de pagamento</label><textarea id="o_cond" style="min-height:60px">${esc(o.condicoes)}</textarea></div>
  <div class="fld"><label>Observações (o que está incluso / não incluso)</label><textarea id="o_obs" style="min-height:60px">${esc(o.obs)}</textarea></div>
  <div class="mact">${o.id ? '<button type="button" class="btn danger" id="o_del">Excluir</button>' : ''}<span style="flex:1"></span>
    <button type="button" class="btn" onclick="fecharModal()">Cancelar</button><button type="button" class="btn" id="o_save">Salvar</button><button type="button" class="btn pri" id="o_pdf">Salvar e gerar PDF</button></div>`, 'wide');
  const linhas = () => {
    $('#o_itens').innerHTML = o.itens.map((i, k) => `<tr><td><input list="dl_etapas" data-k="etapa" data-i="${k}" value="${esc(i.etapa)}" placeholder="Etapa" style="width:165px"></td>
      <td><input data-k="descricao" data-i="${k}" value="${esc(i.descricao)}" placeholder="Descrição do serviço/material" style="min-width:200px"></td>
      <td><select data-k="unidade" data-i="${k}" style="width:78px">${['vb', 'm²', ...OPC.unid.filter(u => u !== 'm²')].map(u => `<option ${u === i.unidade ? 'selected' : ''}>${u}</option>`).join('')}</select></td>
      <td><input type="number" step="any" data-k="qtd" data-i="${k}" value="${esc(i.qtd)}" style="width:70px;text-align:right"></td>
      <td><input type="number" step="0.01" data-k="valor" data-i="${k}" value="${esc(i.valor)}" style="width:100px;text-align:right"></td>
      <td class="r" id="o_tl${k}" style="white-space:nowrap">${brl((+i.qtd || 0) * (+i.valor || 0))}</td>
      <td><button type="button" class="btn sm danger" data-rm="${k}" title="Remover">×</button></td></tr>`).join('');
    tot();
  };
  const tot = () => {
    o.bdiPct = $('#o_bdi').value === '' ? '' : +$('#o_bdi').value; o.descontoPct = $('#o_desc').value === '' ? '' : +$('#o_desc').value;
    const t = totaisOrc(o);
    $('#o_tot').innerHTML = `<div><span>Seu custo</span><b>${brl(t.custo)}</b></div><div><span>Preço ao cliente${+o.bdiPct ? ` (+${num(o.bdiPct)}%)` : ''}</span><b>${brl(t.preco)}</b></div>${t.desc ? `<div><span>Desconto</span><b>− ${brl(t.desc)}</b></div>` : ''}<div class="tt"><span>Total do orçamento</span><b>${brl(t.total)}</b></div><div><span>Lucro estimado</span><b style="color:${t.lucro >= 0 ? 'var(--ok)' : 'var(--bad)'}">${brl(t.lucro)}${t.total ? ` (${Math.round(t.lucro / t.total * 100)}%)` : ''}</b></div>`;
  };
  const tb = $('#o_itens');
  tb.addEventListener('input', e => { const el = e.target, k = el.dataset.k, i = +el.dataset.i; if (!k) return; o.itens[i][k] = ['qtd','valor'].includes(k) ? (el.value === '' ? '' : +el.value) : el.value; if (['qtd','valor'].includes(k)) { $('#o_tl' + i).textContent = brl((+o.itens[i].qtd || 0) * (+o.itens[i].valor || 0)); tot(); } });
  tb.addEventListener('change', e => { const el = e.target; if (el.tagName === 'SELECT') o.itens[+el.dataset.i].unidade = el.value; });
  tb.addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (!b) return; o.itens.splice(+b.dataset.rm, 1); if (!o.itens.length) o.itens.push({etapa:'', descricao:'', unidade:'un', qtd:1, valor:''}); linhas(); });
  $('#o_add').onclick = () => { const ult = o.itens[o.itens.length - 1]; o.itens.push({etapa:ult ? ult.etapa : '', descricao:'', unidade:'un', qtd:1, valor:''}); linhas(); tb.querySelector(`tr:last-child [data-k="descricao"]`).focus(); };
  $('#o_addEt').onclick = () => { o.itens.push({etapa:'', descricao:'', unidade:'un', qtd:1, valor:''}); linhas(); tb.querySelector(`tr:last-child [data-k="etapa"]`).focus(); };
  $('#o_bdi').oninput = tot; $('#o_desc').oninput = tot;
  const cliVis = () => { $('#o_novo').style.visibility = $('#o_cli').value ? 'hidden' : 'visible'; };
  $('#o_cli').onchange = cliVis; cliVis(); linhas();
  if (ro) toast('Orçamento já aprovado: alterações não mudam a obra criada.');
  const coletar = () => {
    Object.assign(o, {clienteId:$('#o_cli').value, clienteNome:$('#o_cli').value ? '' : $('#o_cnome').value.trim(), clienteTel:$('#o_cli').value ? '' : $('#o_ctel').value.trim(),
      titulo:$('#o_tit').value.trim(), endereco:$('#o_end').value.trim(), data:$('#o_data').value || hoje(), validadeDias:+$('#o_val').value || 0, prazo:$('#o_prazo').value.trim(),
      status:$('#o_st').value, condicoes:$('#o_cond').value.trim(), obs:$('#o_obs').value.trim()});
    o.itens = o.itens.filter(i => (i.descricao || '').trim() || +i.valor);
    if (!o.titulo) { toast('Preencha o serviço / título'); return null; }
    if (!o.clienteId && !o.clienteNome) { toast('Escolha ou digite o cliente'); return null; }
    if (!o.itens.length) { toast('Adicione pelo menos um item'); return null; }
    return o;
  };
  const gravar = async pdf => { const x = coletar(); if (!x) return; await salvar('orcamentos', x); fecharModal(); render(); toast('Orçamento salvo'); if (pdf) abrirPdfOrc(x); };
  $('#o_save').onclick = () => gravar(false);
  $('#o_pdf').onclick = () => gravar(true);
  if (o.id) $('#o_del').onclick = async () => { if (!confirm('Excluir este orçamento?')) return; await excluir('orcamentos', o.id); fecharModal(); render(); toast('Excluído'); };
}

const CONTRATO_PADRAO = `CONTRATO DE PRESTAÇÃO DE SERVIÇOS DE CONSTRUÇÃO CIVIL

CONTRATANTE: {{CLIENTE}}, inscrito(a) no CPF/CNPJ sob o nº {{CPF_CLIENTE}}, residente em {{ENDERECO_CLIENTE}}, telefone {{TELEFONE_CLIENTE}}.

CLÁUSULA 1ª – DO OBJETO
A CONTRATADA se obriga a executar, para a CONTRATANTE, a obra/serviço "{{OBRA}}", no endereço {{ENDERECO_OBRA}}, conforme o escopo abaixo:
{{ESCOPO}}

CLÁUSULA 2ª – DO PREÇO E DA FORMA DE PAGAMENTO
Pelo serviço contratado, a CONTRATANTE pagará à CONTRATADA o valor total de {{VALOR}}, em {{PARCELAS}} parcela(s), com o primeiro vencimento em {{PRIMEIRO_VENCIMENTO}}. O atraso no pagamento sujeitará a CONTRATANTE a multa de 2% (dois por cento) e juros de 1% (um por cento) ao mês sobre o valor em atraso.

CLÁUSULA 3ª – DO PRAZO
A obra será executada no prazo de {{PRAZO}}, contado a partir do início dos serviços. O prazo poderá ser prorrogado em caso de chuvas que impeçam o trabalho, atraso nos pagamentos, falta de liberações de responsabilidade da CONTRATANTE, alterações de projeto ou caso fortuito e força maior.

CLÁUSULA 4ª – DAS OBRIGAÇÕES DA CONTRATADA
a) executar os serviços com qualidade, seguindo as normas técnicas aplicáveis;

CLÁUSULA 5ª – DAS OBRIGAÇÕES DA CONTRATANTE

CLÁUSULA 7ª – DA GARANTIA
A CONTRATADA responde pela solidez e segurança da obra nos termos do art. 618 do Código Civil.

CLÁUSULA 8ª – DA RESCISÃO
O contrato poderá ser rescindido por qualquer das partes em caso de descumprimento das cláusulas, mediante aviso por escrito, ficando a CONTRATANTE obrigada a pagar pelos serviços já executados.

As partes declaram que leram e concordam com todas as cláusulas, assinando este contrato eletronicamente.

/* Quadro de assinatura com o dedo ou o mouse */
function padAssinatura(cv) {
  const r = window.devicePixelRatio || 1, ctx = cv.getContext('2d'); let des = false, usado = false, ult = null;
  const ajusta = () => { const b = cv.getBoundingClientRect(); cv.width = b.width * r; cv.height = b.height * r; ctx.scale(r, r); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111827'; };
  ajusta();
  const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); des = true; usado = true; ult = pt(e); cv.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.arc(ult[0], ult[1], 1.1, 0, 7); ctx.fillStyle = '#111827'; ctx.fill(); });
  cv.addEventListener('pointermove', e => { if (!des) return; e.preventDefault(); const p = pt(e); ctx.beginPath(); ctx.moveTo(ult[0], ult[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); ult = p; });
  ['pointerup','pointercancel','pointerleave'].forEach(t => cv.addEventListener(t, () => { des = false; }));
  return {limpar:() => { ctx.clearRect(0, 0, cv.width, cv.height); usado = false; }, vazio:() => !usado, png:() => cv.toDataURL('image/png')};
}

function novaVistoria(obraId, tipo) {

  editorVistoria({obraId, tipo:tipo || 'Entrega da obra', data:hoje(), responsavel:S.perfil.nome || '', prazoPend:'15 dias', itens});
}
function prontaParaAssinar(v) {
  const c = contaVist(v);
  if (c.nada) { if (!confirm(`Ainda há ${c.nada} item(ns) sem verificar. Eles sairão como "—" no documento.\n\nContinuar mesmo assim?`)) return false; }
  const o = achar('obras', v.obraId) || {};
  if (!o.clienteId) { toast('Defina o cliente da obra (Editar obra) antes de assinar.'); return false; }
  return avisoFaltando(textoVistoria(v));
}
function assinarVistoriaAqui(id) {
  const v = achar('vistorias', id), o = achar('obras', v.obraId) || {}, c = achar('clientes', o.clienteId) || {};
  if (!prontaParaAssinar(v)) return;
  const texto = textoVistoria(v), cnt = contaVist(v);
  modal(`<h3>Assinatura — ${esc(v.tipo)}</h3><div class="ctprev">${esc(texto)}</div>
    <p style="margin:0 0 12px;color:var(--mut)">Checklist: <b style="color:var(--ok)">${cnt.ok} OK</b> · <b style="color:var(--bad)">${cnt.pend} pendente(s)</b> · ${cnt.na} N/A</p>
    <div class="f2"><div class="fld"><label>Nome completo de quem assina</label><input id="s_nome" value="${esc(c.nome)}"></div><div class="fld"><label>CPF</label><input id="s_cpf" value="${esc(c.cpfCnpj)}" inputmode="numeric"></div></div>
    ${HTML_PAD('s_pad')}<label class="chk" style="margin-top:10px"><input type="checkbox" id="s_ok"> Conferi a obra e concordo com este ${v.tipo === 'Entrega da obra' ? 'termo de entrega' : 'relatório'}.</label>
    <div class="mact"><span style="flex:1"></span><button class="btn" onclick="fecharModal()">Cancelar</button><button class="btn pri" id="s_go">Confirmar assinatura</button></div>`, 'wide');
  const pad = padAssinatura($('#s_pad')); $('#s_pad_limpar').onclick = pad.limpar;
  $('#s_go').onclick = async () => {
    const nome = $('#s_nome').value.trim(), cpf = $('#s_cpf').value.trim();
    if (nome.length < 5) return toast('Digite o nome completo.'); if (!cpfOk(cpf)) return toast('Digite um CPF/CNPJ válido.');
    if (pad.vazio()) return toast('Faça a assinatura no quadro.'); if (!$('#s_ok').checked) return toast('Marque a confirmação.');
    $('#s_go').disabled = true;
    const x = await salvar('vistorias', {...v, textoFinal:texto, assinaturaEmpresa:S.empresa.assinatura || '', assinatura:{img:pad.png(), nome, cpf, em:new Date().toISOString(), modo:'presencial', dispositivo:navigator.userAgent.slice(0, 160)}});
    fecharModal(); await aposAssinarVistoria(x); render(); toast('Assinado!');
  };
}
async function enviarVistoria(id) {
  const v = achar('vistorias', id), o = achar('obras', v.obraId) || {}, c = achar('clientes', o.clienteId) || {};
  let tk = v.assinaturaToken;
  if (!tk) {
    if (!prontaParaAssinar(v)) return;
    tk = gid() + gid(); const texto = textoVistoria(v);
    await API.setAssinatura(tk, {empresaId:S.eid, empresaNome:S.empresa.nome, empresaTel:S.empresa.telefone || '', logo:S.empresa.logo || '', assinaturaEmpresa:S.empresa.assinatura || '',
      numero:(o.nome || '') + ' · ' + fdata(v.data), clienteNome:c.nome || '', texto, docNome:v.tipo === 'Entrega da obra' ? 'termo de entrega' : 'relatório de vistoria',
      checklist:(v.itens || []).map(i => ({ambiente:i.ambiente, item:i.item, status:i.status || '', obs:i.obs || ''})), status:'pendente', criadoEm:Date.now()});
    await salvar('vistorias', {...v, assinaturaToken:tk, textoFinal:texto, assinaturaEmpresa:S.empresa.assinatura || ''}); render();
  }
  const url = location.origin + location.pathname + '?assinar=' + tk;
  modal(`<h3>Enviar para o cliente assinar</h3><p style="color:var(--mut);margin-top:0">O cliente abre o link no celular, confere a lista e assina com o dedo.</p>
    <div class="fld"><input value="${esc(url)}" readonly onclick="this.select()"></div>${USE_FB ? '' : '<p class="demo">Modo demonstração: o link só abre neste navegador.</p>'}
    <div class="mact"><span style="flex:1"></span><button class="btn" onclick="navigator.clipboard.writeText('${esc(url)}');toast('Link copiado')">Copiar</button>
    ${c.telefone ? `<a class="btn pri" target="_blank" href="${wa(c.telefone, `Olá, ${(c.nome || '').split(' ')[0]}! Segue o ${v.tipo === 'Entrega da obra' ? 'termo de entrega' : 'relatório de vistoria'} da obra "${o.nome}" para você conferir e assinar pelo celular: ${url}`)}">Enviar no WhatsApp</a>` : ''}</div>`);
}
async function aposAssinarVistoria(v) {
  if (v.tipo !== 'Entrega da obra') return;
  const o = achar('obras', v.obraId); if (!o || o.status === 'Concluída') return;
  await salvar('obras', {...o, status:'Concluída', entregueEm:(v.assinatura.em || '').slice(0, 10) || hoje()}); syncPortal(o.id);
}
function abaVistorias(o) {
  const vs = S.data.vistorias.filter(v => v.obraId === o.id).sort((a, b) => (b.data || '').localeCompare(a.data || ''));
  if (vs.some(v => v.assinaturaToken && !v.assinatura)) setTimeout(checarAssinaturas, 50);
  return `<div class="row" style="justify-content:space-between;margin-bottom:12px"><span style="color:var(--mut)">Checklist com fotos e termo assinado pelo cliente. Ao assinar a entrega, a obra é marcada como Concluída.</span>
    <div class="row"><button class="btn" data-act="novaVist" data-a="${o.id}" data-b="Vistoria intermediária">+ Vistoria</button><button class="btn pri" data-act="novaVist" data-a="${o.id}" data-b="Entrega da obra">+ Entrega da obra</button></div></div>`
  + (vs.length ? `<div class="grid3">${vs.map(v => { const c = contaVist(v), tot = (v.itens || []).length;
      return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><div><b>${esc(v.tipo)}</b><div style="color:var(--mut);font-size:12.5px">${fdata(v.data)}${v.responsavel ? ' · ' + esc(v.responsavel) : ''}</div></div>${badgeVist(v)}</div>
      <div style="margin:12px 0 6px">${barra(tot ? (tot - c.nada) / tot * 100 : 0, c.nada ? '' : 'g')}</div>
      <div style="font-size:12.5px;color:var(--mut);margin-bottom:12px"><b style="color:var(--ok)">${c.ok} OK</b> · <b style="color:${c.pend ? 'var(--bad)' : 'inherit'}">${c.pend} pendente(s)</b> · ${c.na} N/A${c.nada ? ` · ${c.nada} a verificar` : ''}</div>
      <div class="row"><button class="btn sm" data-act="editVist" data-a="${v.id}">${v.assinatura || v.assinaturaToken ? 'Ver lista' : 'Abrir checklist'}</button><button class="btn sm" data-act="docVist" data-a="${v.id}">Documento</button>${v.assinatura ? '' : `<button class="btn sm pri" data-act="menuVist" data-a="${v.id}">${v.assinaturaToken ? 'Link de assinatura' : 'Assinar'}</button>`}</div></div>`; }).join('')}</div>`
    : '<div class="vazio">Nenhuma vistoria ainda. Use "+ Entrega da obra" para fazer o checklist final e o termo de entrega.</div>');
}

document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]')) return;
  const b = e.target.closest('[data-act]');
  if (b) { e.preventDefault(); e.stopPropagation(); const f = ACT[b.dataset.act]; if (f) Promise.resolve(f(b.dataset.a, b.dataset.b)).catch(err => { console.error(err); toast('Erro: ' + err.message); }); return; }
  const tr = e.target.closest('tr[data-id]');
  if (tr && tr.dataset.col) { if (tr.dataset.col === 'obras') ACT.obra(tr.dataset.id); else if (tr.dataset.col === 'orcamentos') editorOrc(achar('orcamentos', tr.dataset.id)); else ACT.edit(tr.dataset.col, tr.dataset.id); }
});
document.addEventListener('change', e => {
  const s = e.target.closest('[data-chg]'); if (!s) return;
  if (s.dataset.chg === 'filtro') S.filtro[s.dataset.a] = s.value; else if (s.dataset.chg === 'fin') S.filtro.fin[s.dataset.a] = s.value;
  render();
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'frmEmp') return; e.preventDefault();
  const x = {nome:$('#e_nome').value.trim(), cnpj:$('#e_cnpj').value.trim(), telefone:$('#e_tel').value.trim(), cidade:$('#e_cid').value.trim()};
  await API.setEmpresa(S.eid, x); Object.assign(S.empresa, x); montarApp(); toast('Dados salvos');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

function traduz(err) {
  const c = err.code || '';
  return ({'auth/invalid-credential':'E-mail ou senha incorretos.', 'auth/wrong-password':'E-mail ou senha incorretos.', 'auth/user-not-found':'E-mail ou senha incorretos.', 'auth/email-already-in-use':'Este e-mail já está cadastrado.', 'auth/weak-password':'A senha precisa ter pelo menos 6 caracteres.', 'auth/invalid-email':'E-mail inválido.', 'auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos.', 'permission-denied':'Sem permissão no banco de dados: as regras do Firestore não foram publicadas (Firestore → Regras → colar o firestore.rules → Publicar).', 'unavailable':'Não conectou ao banco de dados. Verifique se o Firestore Database foi criado no Firebase.', 'auth/operation-not-allowed':'Login por e-mail/senha não está ativado no Firebase (Authentication → Método de login → E-mail/senha).', 'auth/unauthorized-domain':'Este endereço não está autorizado no Firebase (Authentication → Configurações → Domínios autorizados → jefframalho.github.io).'})[c]
    || (/offline/i.test(err.message || '') ? 'Não conectou ao banco de dados. Verifique se o Firestore Database foi criado no Firebase (botão "Criar banco de dados").' : err.message);
}
function telaLogin(aba = 'entrar') {
  $('#root').innerHTML = `<div class="auth"><div class="authL"><div class="brand" style="padding:0"><div class="logo">${ico('logo')}</div>Gestor de Obras</div>
    <h1>Sua construtora organizada, da fundação à entrega.</h1><p>Obras, cronograma, diário com fotos, custos, materiais, equipe e clientes em um só lugar — no computador ou no celular.</p>
    <ul><li>Custo real × orçamento de cada obra</li><li>Diário de obra com fotos direto do canteiro</li><li>Contas a pagar e receber, parcelas de contrato</li><li>Estoque por obra e pedidos ao fornecedor pelo WhatsApp</li><li>Diárias da equipe e pagamento em um clique</li><li>Portal para o cliente acompanhar a obra</li></ul></div>
    <div class="authR"><div class="authBox"><div class="tabs"><button class="${aba === 'entrar' ? 'on' : ''}" onclick="telaLogin('entrar')">Entrar</button><button class="${aba === 'criar' ? 'on' : ''}" onclick="telaLogin('criar')">Criar conta grátis</button></div>
    ${aba === 'entrar' ? `<h2>Entrar</h2><p style="color:var(--mut);margin-top:4px">Acesse a sua construtora.</p><form id="fl">
      <div class="fld"><label>E-mail</label><input id="l_email" type="email" required autocomplete="email"></div>
      <div class="fld"><label>Senha</label><input id="l_senha" type="password" required autocomplete="current-password"></div>
      <button class="btn pri" id="l_ok">Entrar</button></form><p style="text-align:center"><a href="#" id="l_esq">Esqueci minha senha</a></p>`
    : `<h2>Teste grátis por ${DIAS_TESTE} dias</h2><p style="color:var(--mut);margin-top:4px">Depois, ${brl(PRECO_MENSAL)}/mês. Sem fidelidade.</p><form id="fc">
      <div class="fld"><label>Nome da construtora</label><input id="c_emp" required></div>
      <div class="f2"><div class="fld"><label>Seu nome</label><input id="c_nome" required></div><div class="fld"><label>WhatsApp</label><input id="c_tel" required></div></div>
      <div class="fld"><label>E-mail</label><input id="c_email" type="email" required autocomplete="email"></div>
      <div class="fld"><label>Senha (mín. 6)</label><input id="c_senha" type="password" minlength="6" required autocomplete="new-password"></div>
      <button class="btn pri" id="c_ok">Começar teste grátis</button></form>`}
    ${USE_FB ? '' : `<div class="demo"><b>Modo demonstração.</b> Os dados ficam só neste navegador. Configure o Firebase para usar de verdade.<br><button class="btn sm" style="margin-top:8px;width:auto" id="b_demo">Entrar com dados de exemplo</button></div>`}
    </div></div></div>`;
  const fl = $('#fl'), fc = $('#fc');
  if (fl) {
    fl.onsubmit = async e => { e.preventDefault(); $('#l_ok').disabled = true; try { const uid = await API.login($('#l_email').value, $('#l_senha').value); await entrar(uid); } catch (err) { console.error(err); telaLogin(); toast(traduz(err)); } };
    $('#l_esq').onclick = async e => { e.preventDefault(); const em = $('#l_email').value || prompt('Seu e-mail:'); if (!em) return; try { await API.resetSenha(em); toast('Enviamos um link de nova senha para ' + em); } catch (err) { toast(traduz(err)); } };
  }
  if (fc) fc.onsubmit = async e => {
    e.preventDefault(); $('#c_ok').disabled = true;
    try { await criarConstrutora({empresa:$('#c_emp').value.trim(), nome:$('#c_nome').value.trim(), tel:$('#c_tel').value.trim(), email:$('#c_email').value.trim().toLowerCase(), senha:$('#c_senha').value}); }
    catch (err) { console.error(err); if (!$('#c_ok')) telaLogin('criar'); else $('#c_ok').disabled = false; toast(traduz(err)); }
  };
  const bd = $('#b_demo');
  if (bd) bd.onclick = async () => {
    try { let uid; try { uid = await API.login('demo@gestordeobras.com', '123456'); await entrar(uid); }
      catch (e) { await criarConstrutora({empresa:'Construtora Exemplo', nome:'Usuário Demo', tel:'(88) 99999-0000', email:'demo@gestordeobras.com', senha:'123456'}, true); } }
    catch (err) { toast(traduz(err)); }

}
async function criarConstrutora(c, exemplo) {
  const uid = await API.criarConta(c.email, c.senha);
  await API.setPerfil(uid, {nome:c.nome, email:c.email, empresaId:uid, papel:'admin'});
  await API.setEmpresa(uid, {nome:c.empresa, telefone:c.tel, donoNome:c.nome, donoEmail:c.email, status:'teste', criadoEm:Date.now(), venceTs:Date.now() + DIAS_TESTE * 864e5});
  await entrar(uid);
  if (exemplo) { await dadosExemplo(); render(); }
}
async function entrar(uid) {
  carregando('Abrindo sua construtora...');
  S.uid = uid; S.email = API.emailAtual();
  S.perfil = await API.getPerfil(uid);
  if (!S.perfil) {
    if (isAdmin()) { S.page = 'admin'; S.empresa = null; return montarApp(); }
    toast('Este usuário não está ligado a nenhuma construtora.'); await API.logout(); return telaLogin();
  }
  S.eid = S.perfil.empresaId; S.empresa = await API.getEmpresa(S.eid);
  if (!S.empresa) { toast('Construtora não encontrada.'); await API.logout(); return telaLogin(); }
  if (bloqueada(S.empresa) && !isAdmin()) return telaBloqueio();
  await carregarTudo(); S.page = 'dashboard'; montarApp();
  setTimeout(checarAssinaturas, 1500);
}
function telaBloqueio() {
  const e = S.empresa;
  $('#root').innerHTML = `<div class="authR" style="min-height:100vh"><div class="card" style="max-width:440px;text-align:center;padding:32px"><div class="logo" style="margin:0 auto 14px;width:48px;height:48px">${ico('logo')}</div>
    <h2 style="margin:0 0 6px">${e.status === 'bloqueado' ? 'Acesso suspenso' : e.status === 'teste' ? 'Seu teste grátis terminou' : 'Assinatura vencida'}</h2>
    <p style="color:var(--mut)">Os dados da <b>${esc(e.nome)}</b> estão guardados com segurança. Para voltar a usar, ${e.status === 'teste' ? 'assine' : 'renove'} o Gestor de Obras por <b>${brl(PRECO_MENSAL)}/mês</b>.</p>
    <a class="btn pri" style="width:100%;justify-content:center;padding:11px" target="_blank" href="${wa(WHATS_SUPORTE, `Olá! Quero ${e.status === 'teste' ? 'assinar' : 'renovar'} o Gestor de Obras da ${e.nome}.`)}">Pagar pelo WhatsApp (Pix, boleto ou cartão)</a>
    <button class="btn" style="width:100%;justify-content:center;margin-top:8px" data-act="sair">Sair</button></div></div>`;
}

/* ===================== PORTAL PÚBLICO DO CLIENTE ===================== */
async function renderPortal(token) {
  document.title = 'Acompanhe sua obra';
  $('#root').innerHTML = '<div class="portal"><div class="vazio">Carregando...</div></div>';
  let p = null; try { p = await API.getPortal(token); } catch (e) { console.error(e); }
  if (!p || !p.ativo) { $('#root').innerHTML = `<div class="portal"><div class="vazio">Este link não está disponível. Fale com a construtora.</div></div>`; return; }
  document.title = p.obraNome + ' — acompanhamento';
  $('#root').innerHTML = `<div class="portal"><div class="phead"><small style="color:var(--pri);font-weight:700;text-transform:uppercase;letter-spacing:.06em">${esc(p.empresaNome)}</small><h1>${esc(p.obraNome)}</h1><p>${esc(p.endereco)}</p>
    <div style="display:flex;align-items:end;gap:18px;margin-top:18px;flex-wrap:wrap"><div><div class="big">${p.progresso}%</div><small style="color:#aab2bd">concluído</small></div><div style="flex:1;min-width:180px"><div class="bar" style="height:12px;border:0;background:#2a313c"><i style="width:${p.progresso}%"></i></div>
    <div style="display:flex;justify-content:space-between;color:#aab2bd;font-size:12.5px;margin-top:8px"><span>Início ${fdata(p.inicio)}</span><span>Entrega prevista ${fdata(p.previsao)}</span></div></div></div></div>
    <div class="card" style="margin-bottom:16px"><h3>Etapas da obra</h3><div class="list">${p.etapas.length ? p.etapas.map(e => `<div class="it"><div style="flex:1"><b>${esc(e.nome)}</b><small>${fdata(e.inicio)} a ${fdata(e.fim)}</small></div><div style="width:150px">${barra(e.percentual, e.percentual >= 100 ? 'g' : '')}</div></div>`).join('') : '<p style="color:var(--mut)">Em breve.</p>'}</div></div>
    <div class="card"><h3>Diário da obra</h3><div class="diario">${p.diario.length ? p.diario.map(d => `<div class="dia" style="cursor:default">${d.thumb ? `<img src="${d.thumb}" alt="">` : ''}<div><h5>${fdata(d.data)}${d.clima ? ' · ' + esc(d.clima) : ''}</h5><p>${esc(d.texto)}</p></div></div>`).join('') : '<p style="color:var(--mut)">Nenhum registro ainda.</p>'}</div></div>
    <p style="text-align:center;color:var(--mut);font-size:12.5px;margin-top:20px">Atualizado em ${new Date(p.atualizadoEm).toLocaleString('pt-BR')}${p.empresaTel ? ` · <a target="_blank" href="${wa(p.empresaTel, 'Olá! Tenho uma dúvida sobre a obra ' + p.obraNome + '.')}">Falar com a construtora</a>` : ''}</p></div>`;
}

/* ===================== INÍCIO ===================== */
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get('portal')) return renderPortal(q.get('portal'));
  if (q.get('assinar')) return renderAssinar(q.get('assinar'));
  try { const uid = await API.uidAtual(); if (uid) await entrar(uid); else telaLogin(q.get('criar') ? 'criar' : 'entrar'); }
  catch (e) { console.error(e); telaLogin(); toast(traduz(e)); }
})();
